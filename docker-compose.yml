services:
  corrector-tal:
    build: .
    container_name: talcorrector
    restart: unless-stopped
    ports:
     - "2026:5001"
    environment:
        FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:?Définir FLASK_SECRET_KEY avant le déploiement}"
        TAL_EVALUATION_SESSION: "${TAL_EVALUATION_SESSION:-principale}"
        TAL_ACADEMIC_YEAR: "${TAL_ACADEMIC_YEAR:-}"
    volumes:
      # Ajout de ce volume pour la persistance des données
      - ./soumissions:/app/soumissions
      # - ./app:/app/  # pour dev c'est pratique
    networks:
      - proxnet

networks:
  proxnet:
    external: true