# Exemple de configuration SWAG pour TAL, inspiré des configurations
# universite-tal.subfolder.conf et universite-tc-ia2026.subfolder.conf
# fournies par le mainteneur en novembre 2026.
# Emplacement : /config/nginx/proxy-confs/universite-tal.subfolder.conf
# SWAG et corrector-tal doivent partager le réseau Docker proxnet.
#
# Attention : si /config/nginx/proxy.conf définit déjà certaines directives
# proxy_set_header, vérifier la configuration effective avec nginx -T
# avant le rechargement. Conserver une seule définition par nom.

location = /universite/tal {
    return 301 /universite/tal/;
}

location ^~ /universite/tal/ {
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;

    set $upstream_app corrector-tal;
    set $upstream_port 5001;
    set $upstream_proto http;

    # Même stripping que Journalia : Flask ne reçoit pas /universite/tal.
    rewrite ^/universite/tal(/.*)$ $1 break;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    # /config/nginx/proxy.conf fournit deja Host, X-Forwarded-Host
    # et X-Forwarded-Proto : ne pas les repeter, sinon Gunicorn peut
    # refuser la requete (Invalid HTTP Header: 'HOST').
    # TAL ne doit ajouter que les champs specifiques au sous-chemin.
    proxy_set_header X-Forwarded-Prefix /universite/tal;
    proxy_set_header X-Script-Name /universite/tal;

    # Préserver les paramètres de sécurité et limites de téléchargement
    # déjà définis dans le fichier actif du mainteneur.
}
